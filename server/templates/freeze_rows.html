{% import "tk.html" as tk %}{% call tk::rows(v.table) %}
<div class="more" id="{{ v.table.id }}-more" hx-swap-oob="true">{% if !v.table.more.is_empty() %}<button type="button" class="btn" hx-get="{{ v.table.more }}" hx-target="#{{ v.table.id }}-body" hx-swap="beforeend">Load more</button>{% endif %}</div>
<span class="tkn" id="{{ v.table.id }}-count" hx-swap-oob="true" data-tkn aria-live="polite">{{ v.table.count_text() }}</span>
