<figure class="card lanes{% if lz.compact %} compact{% endif %}{% if lz.strip %} strip{% endif %}{% if lz.scaled %} scaled{% endif %}" id="{{ lz.id }}" data-live aria-labelledby="{{ lz.id }}-h" data-lanes data-now="{{ lz.now_ms }}" data-clock0="{{ lz.now_label }}" data-f0="{{ lz.now_f }}" data-win="{{ lz.win1 - lz.win0 }}" data-lo="{{ lz.lo_min }}" data-hi="{{ lz.hi_min }}"{% if !lz.live_url.is_empty() %} hx-get="{{ lz.live_url }}" hx-trigger="every 30s [document.visibilityState==='visible']" hx-swap="outerHTML"{% endif %}>
<div class="ch"><h2 class="ct" id="{{ lz.id }}-h">{{ lz.title }}</h2>
{% if !lz.strip %}<div class="seg zoom" role="group" aria-label="Zoom the timeline">{% for z in lz.zoom_links %}<a href="{{ z.href }}" aria-pressed="{{ z.on }}" data-zoom>{{ z.label }}</a>{% endfor %}</div>
{% if !lz.zoom_reset.is_empty() %}<span class="zlab mono">{{ lz.zoom_label }}</span><a class="btn zreset" href="{{ lz.zoom_reset }}" data-zoom>Reset zoom</a>{% endif %}
<span class="zhint" hidden>Drag across the lanes to zoom in · pinch or Ctrl + wheel</span>{% endif %}
<span class="key"><span class="sw sw-s"></span>Server wait</span><span class="key"><span class="sw sw-c"></span>Client time</span><span class="lnote">{% if lz.scaled %}Positions and widths to time scale{% else if lz.strip %}Positions to time scale{% else %}Block width grows with duration; not to time scale{% endif %}</span></div>
{% if let Some(n) = lz.latest %}<p class="latest-line"><span class="nb">Newest</span> <span class="mono">{{ n.t }}</span> <span class="ago" data-ago="{{ n.iso }}">{{ n.ago }}</span> · <b>{{ n.layout }}</b> · {{ n.acct }} · {{ n.client }} · <span class="mono">{{ n.d }}</span></p>{% endif %}
<div class="lz">
<div class="lzr lzax" aria-hidden="true"><span></span><div class="trk">{% for a in lz.axis %}<span class="tick{% if !a.wide %} nw{% endif %}{% if !a.narrow %} nn{% endif %}{% if a.near %} hid{% endif %}" style="left: {{ a.x }}">{{ a.label }}</span>{% endfor %}{% if lz.has_now() %}<span class="rec{% if lz.rec_left %} rec-l{% endif %}" style="left: {{ lz.now_x }}"><i class="{% if lz.rec %}on{% else %}sb{% endif %}"></i>{% if lz.rec %}REC{% else %}STANDBY{% endif %} <time data-clock>{{ lz.now_label }}</time></span>{% endif %}</div><span></span></div>
{% if lz.has_now() %}<div class="ph" style="--f: {{ lz.now_f }}" aria-hidden="true"></div>{% endif %}
{% for l in lz.lanes %}
<div class="lzr ln" role="group" aria-label="{{ l.label }}">
<a class="lnl" href="{{ l.url }}" title="{{ l.label }}">{{ l.label }}</a>
<div class="trk">
<div class="base"></div>
{% for s in l.sess %}<div class="ss" title="{{ s.title }}" style="left: {{ s.x }}; width: {{ s.w }}"></div>{% endfor %}
{% if !l.now_x.is_empty() %}<div class="nowl" style="left: {{ l.now_x }}" aria-hidden="true"></div>{% endif %}
{% for b in l.blocks %}<span class="fz{% if b.hit %} hit{% endif %}{% if b.newest %} newest{% endif %}" role="img" style="left: {{ b.x }}; width: {{ b.wc }}" tabindex="{% if loop.first %}0{% else %}-1{% endif %}" aria-label="{{ b.aria }}" title="{{ b.aria }}" data-id="{{ b.id }}" data-t="{{ b.t }}" data-d="{{ b.d }}" data-from="{{ b.from }}" data-layout="{{ b.layout }}" data-acct="{{ b.acct }}" data-script="{{ b.script }}" data-client="{{ b.client }}" data-srv="{{ b.srv }}" data-cli="{{ b.cli }}" data-pct="{{ b.pct }}" data-bin="{{ b.bin }}"><span class="s" style="width: {{ b.swc }}"></span><span class="c"></span></span>{% endfor %}
</div>
<span class="lnt"><span>{{ l.total }}</span> · {{ l.n }}{% if l.off %} · off{% endif %}</span>
</div>
{% endfor %}
{% if !lz.more.is_empty() %}<div class="lzr ln"><span></span><a class="lmore" href="{{ lz.more_url }}">{{ lz.more }}</a><span></span></div>{% endif %}
</div>
<div class="lzf"><figcaption>{{ lz.caption }}{% if !lz.note.is_empty() %} <span class="muted">{{ lz.note }}</span>{% endif %}</figcaption>
{% if !lz.table.is_empty() %}<details class="tv"><summary class="btn">Table view</summary>
<div class="tw"><table class="t">
<thead><tr><th>Time</th><th>Client</th><th>Layout</th><th>Account</th><th class="r">Duration</th><th class="r">Server</th></tr></thead>
<tbody>{% for r in lz.table %}<tr><td class="mono"><a class="lite" href="{{ r.url }}">{{ r.t }}</a></td><td>{{ r.client }}</td><td>{{ r.layout }}</td><td class="mono">{{ r.acct }}</td><td class="r mono">{{ r.d }}</td><td class="r mono">{{ r.pct }}</td></tr>{% endfor %}</tbody>
</table></div>{% if lz.table_more %}<div class="sub muted">The newest {{ lz.table.len() }} freezes. All freezes has the rest.</div>{% endif %}
</details>{% endif %}
{% if !lz.all_url.is_empty() %}<a href="{{ lz.all_url }}">All freezes</a>{% endif %}
</div>
</figure>
