{% for r in v.rows %}
<tr><td class="mono"><a class="lite" href="{{ r.url }}">{{ r.t }}</a></td>
<td class="muted">{{ r.file }}</td>
<td><a href="{{ r.layout_url }}">{{ r.layout }}</a></td>
<td class="muted">{{ r.from }}</td>
<td class="mono"><a href="{{ r.user_url }}">{{ r.account }}</a></td>
<td class="muted">{{ r.user }}</td>
<td><a class="lite" href="{{ r.client_url }}">{{ r.client }}</a></td>
<td><a class="lite" href="{{ r.script_url }}">{{ r.script }}</a></td>
<td class="r">{{ r.dur }}</td><td class="r">{{ r.rt }}</td>
<td><div class="hb" title="{{ r.split_title }}"><div class="hs" style="width: {{ r.srv_w }}"></div><div class="hc" style="width: {{ r.cli_w }}"></div></div></td>
<td class="r">{{ r.pct }}</td></tr>
{% endfor %}
